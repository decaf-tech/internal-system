# Dijalankan di server-merah-supermicro, baik manual lewat CLI maupun lewat
# Portainer Stack (deploy dari Git — lihat PRD v3.4 §5 langkah 5). Kedua
# jalur sama-sama cuma mengisi ${VAR} di bawah, tidak ada file env fisik
# yang dibaca dari folder project — supaya Portainer, yang meng-clone repo
# ke folder sendiri dan tidak ikut membawa .env.production, tetap bisa
# deploy tanpa error "env file not found".
#
#   CLI:       docker compose --env-file .env.production up -d --build
#   Portainer: isi enam variabel di bawah lewat Environment variables stack
#
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: decaf-internal-system
    restart: unless-stopped
    # Hanya loopback. Yang menghadap internet adalah Cloudflare Tunnel,
    # bukan port ini — konsisten dengan pagar akses di blueprint §0B.3.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Isi prototipe statis (PRD prototipe / migration 014). SATU-SATUNYA
      # data aplikasi yang hidup di disk container, bukan di Supabase atau
      # Drive — tanpa volume ini, semua prototipe yang sudah dibagikan ke
      # calon klien mati setiap kali stack di-redeploy.
      - prototypes_data:/app/data/prototypes
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      PROTOTYPES_DIR: /app/data/prototypes
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID}
      # Panel infrastruktur di /backoffice/admin. Semuanya opsional —
      # `:-` memberi nilai kosong kalau variabelnya tidak didaftarkan di
      # stack, supaya compose tidak menolak deploy cuma karena panel
      # pelengkap ini belum diisi.
      BESZEL_EMAIL: ${BESZEL_EMAIL:-}
      BESZEL_PASSWORD: ${BESZEL_PASSWORD:-}
      UPTIME_KUMA_API_KEY: ${UPTIME_KUMA_API_KEY:-}
      BESZEL_URL: ${BESZEL_URL:-}
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL:-}

volumes:
  # Named volume, bukan bind mount ke folder di host: Portainer men-deploy
  # dari snapshot yang foldernya berpindah-pindah, jadi path host mana pun
  # yang ditulis di sini akan menunjuk tempat yang salah. Named volume
  # dikelola Docker sendiri dan bertahan lintas redeploy.
  prototypes_data:
